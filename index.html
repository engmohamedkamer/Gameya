<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>تطبيق الجمعية</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF2EF;--card:#fff;--ink:#12302B;--mute:#5B7069;--line:#D5E0DB;--gold:#E0A31B;--ok:#1F8A5B;--bad:#C4442F;--pri:#12302B;--onpri:#F3F7F5;--okbg:#DDF1E7;--badbg:#F8E3DE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1B18;--card:#172622;--ink:#E6F0EC;--mute:#93A9A1;--line:#26403A;--gold:#F0B83A;--ok:#4CC38A;--bad:#F0735E;--pri:#E6F0EC;--onpri:#0F1B18;--okbg:#17382B;--badbg:#3F211B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1B18;--card:#172622;--ink:#E6F0EC;--mute:#93A9A1;--line:#26403A;--gold:#F0B83A;--ok:#4CC38A;--bad:#F0735E;--pri:#E6F0EC;--onpri:#0F1B18;--okbg:#17382B;--badbg:#3F211B;color-scheme:dark}
html,body{height:auto;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:22px;margin:4px 0 0;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.nav b{font-size:18px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 20px inherit;cursor:pointer}
.hero{background:var(--pri);color:var(--onpri);border-radius:18px;padding:18px;margin-bottom:14px}
.hero small{opacity:.75;font-size:14px}
.hero .nm{font-size:26px;font-weight:700;margin:2px 0}
.hero .amt{color:var(--gold);font-size:34px;font-weight:700;line-height:1.2}
.bar{height:8px;border-radius:8px;background:rgba(127,127,127,.3);margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:8px}
ul{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.who{flex:1;min-width:0}
.who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small,.hint{color:var(--mute);font-size:13px}
.pill,.btn,.wa{font:500 14px inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 12px;min-height:40px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.pill.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.wa{background:var(--badbg);color:var(--bad);border-color:transparent}
.btn{background:var(--pri);color:var(--onpri);border-color:transparent;font-weight:700;justify-content:center}
.btn.w{width:100%}
.btn.warn{background:var(--bad);color:#fff}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:90px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{font-weight:700}
.bad{color:var(--bad)}.ok{color:var(--ok)}
.mrow{display:grid;grid-template-columns:1fr 1.2fr;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.mrow small{color:var(--mute);display:block;font-size:13px}
.tabs{position:fixed;inset:auto 0 0 0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:500 14px inherit;padding:8px 2px;min-height:48px;border-radius:10px;cursor:pointer}
.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;background:var(--bg)}
.empty{text-align:center;padding:30px 10px}
.empty h2{font-size:18px;margin:0 0 4px}
.empty p{color:var(--mute);margin:0 0 14px}.row{flex-wrap:wrap}.pa{flex-basis:100%;display:flex;gap:8px;align-items:center}.pa input{max-width:170px;min-height:40px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.scr{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}table{border-collapse:collapse;font-size:14px;width:max-content;min-width:100%}th,td{padding:4px 6px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line)}th.s{position:sticky;right:0;background:var(--card);text-align:right;padding:6px 10px}.cell{min-width:34px;min-height:34px;border:0;background:none;font:700 15px inherit;color:var(--mute);cursor:pointer;border-radius:8px}.cell.ok{color:var(--ok)}.cell.bad{color:var(--bad)}.cell.pt{color:var(--gold)}.cn{color:var(--gold)}.tabs button{font-size:12.5px;padding:8px 0}.rep{background:var(--pri);color:var(--onpri);border-radius:18px;padding:16px;margin-bottom:14px}.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.st div{background:rgba(127,127,127,.2);border-radius:12px;padding:8px;text-align:center}.st small{display:block;opacity:.75;font-size:12px}.st b{font-size:16px}.mem{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}.mem.cur{border:2px solid var(--gold)}.av{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;flex:none}.mem.cur .av{background:var(--gold);color:#12302B}.tag{background:var(--gold);color:#12302B;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700}.dist{flex-basis:100%;font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:6px}.card,.row,.mem{box-shadow:0 1px 3px rgba(18,48,43,.08)}.s-ok{border-inline-start:5px solid var(--ok)}.s-pt{border-inline-start:5px solid var(--gold)}.s-no{border-inline-start:5px solid var(--bad)}.tabs button i{display:block;font-style:normal;font-size:19px;line-height:1.3}.tabs button[aria-current="true"]{box-shadow:inset 0 3px 0 var(--gold)}.tag2{background:var(--bg);color:var(--mute);border-radius:8px;padding:1px 8px;font-size:13px;font-weight:500}.sm{cursor:pointer;color:var(--mute);font-size:14px;min-height:40px;display:flex;align-items:center}.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}#pr{position:fixed;inset:0;z-index:50;background:#fff;color:#111;overflow:auto;padding:env(safe-area-inset-top,0px) 12px calc(20px + env(safe-area-inset-bottom,0px))}#pr[hidden]{display:none}.pbar{display:flex;gap:8px;padding:10px 0;position:sticky;top:0;background:#fff}.pbar .btn{background:#12302B;color:#fff}.pbar .pill{background:#fff;color:#111;border-color:#ccc}.sheet{max-width:760px;margin:0 auto}.sheet h2{margin:0;font-size:22px}.sheet h3{margin:2px 0;font-size:17px;color:#12302B}.ps{color:#555;font-size:14px}.pt{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}.pt th{background:#12302B;color:#fff;padding:8px;text-align:right}.pt td{border-bottom:1px solid #ddd;padding:7px 8px;text-align:right;white-space:normal}.pt tr:nth-child(even) td{background:#F4F7F6}.pf{color:#777;font-size:12px;margin-top:14px}.pill,.btn,.wa,.rcb{font-family:inherit;font-size:14px;font-weight:500}.btn{font-weight:700}.ib{font-family:inherit;font-size:20px;font-weight:700}.cell{font-family:inherit;font-size:15px;font-weight:700}.tabs button{font-family:inherit}.rcb{background:var(--okbg);color:var(--ok);border-radius:10px;padding:9px 12px;min-height:40px;display:inline-flex;align-items:center;text-decoration:none}#lk{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:20px}#lk[hidden]{display:none}.lkb{width:100%;max-width:320px;text-align:center}.lkb input{text-align:center;font-size:22px;letter-spacing:6px}@media print{body.po main,body.po .tabs,.pbar{display:none!important}body.po{background:#fff}#pr{position:static;overflow:visible;padding:0}.pt th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.mdl{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}.mc{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}.hid{display:none!important}#ts{position:fixed;inset:auto 12px calc(74px + env(safe-area-inset-bottom,0px)) 12px;z-index:70;background:var(--pri);color:var(--onpri);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;max-width:536px;margin:0 auto}#ts[hidden]{display:none}#ts button{background:none;border:0;color:var(--gold);font:700 14px inherit;cursor:pointer;min-height:40px}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.seg .pill{justify-content:center}details.card>summary{list-style:none}
</style>
</head>
<body>
<main id="app"></main>
<div id="pr" hidden></div>
<div id="lk" hidden></div><div id="md"></div><div id="ts" hidden></div>
<nav class="tabs" id="tabs"></nav>
<script>
const KEY='gameya_v1';document.head.appendChild(Object.assign(document.createElement('script'),{src:'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'}));
const D=()=>{const n=new Date();return{name:'جمعية الأصحاب',start:n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'),months:12,unit:1000,cur:'جنيه',cc:'20',tpl:'السلام عليكم يا {name} 🌹 تذكير بقسط الجمعية لشهر {month}: {amount}. جزاك الله خير.',members:[],turns:{},paid:{},pay:{},rcv:{},dueDay:0,log:[],sch:{}}};
let ALL;function load(){try{const r=localStorage.getItem('gameya_v2'),o=localStorage.getItem(KEY);ALL=r?JSON.parse(r):{cur:'g1',items:{g1:o?JSON.parse(o):D()}}}catch(e){ALL={cur:'g1',items:{g1:D()}}}return Object.assign(D(),ALL.items[ALL.cur])}
function save(){try{ALL.items[ALL.cur]=S;localStorage.setItem('gameya_v2',JSON.stringify(ALL))}catch(e){}}
let S=load(),tab='month',sub='roles',flt=0,q='',ed=-1,tmr,UND=null,armed='',imp=null,msg='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US');
const mem=id=>S.members.find(m=>m.id==id);
const due=m=>m.shares*S.unit;
const pool=()=>S.members.reduce((a,m)=>a+due(m),0);
const money=n=>fmt(n)+' '+esc(S.cur);const amt=(m,i)=>{const k=i+':'+m.id;return k in S.pay?S.pay[k]:(S.paid[k]?due(m):0)};const rest=(m,i)=>Math.max(0,due(m)-amt(m,i));
function mLabel(i){const[y,m]=S.start.split('-').map(Number);return new Date(y,m-1+i,1).toLocaleDateString('ar-EG-u-nu-latn',{month:'long',year:'numeric'})}
function curIdx(){const[y,m]=S.start.split('-').map(Number),n=new Date();return Math.min(Math.max((n.getFullYear()-y)*12+n.getMonth()+1-m,0),S.months-1)}
let mi=curIdx();
function wa(m){
  if(!m.phone)return '<span class="hint">مفيش رقم</span>';
  let p=String(m.phone).replace(/\D/g,'');
  if(p.startsWith('00'))p=p.slice(2);else if(p.startsWith('0'))p=S.cc+p.slice(1);
  const msg=S.tpl.replace(/\{name\}/g,m.name).replace(/\{month\}/g,mLabel(mi)).replace(/\{amount\}/g,fmt(rest(m,mi))+' '+S.cur);
  return `<a class="wa" target="_blank" rel="noopener" href="https://wa.me/${p}?text=${encodeURIComponent(msg)}">ذكّره واتساب</a>`;
}
function summ(){const P=pool(),rec=mem(S.turns[mi]);let got=0;const ok=[],no=[];S.members.forEach(m=>{got+=Math.min(amt(m,mi),due(m));rest(m,mi)>0?no.push(m.name+' ('+fmt(rest(m,mi))+')'):ok.push(m.name)});const t=S.name+' — '+mLabel(mi)+'\n'+(rname(mi)?'القابض: '+rlist(mi)+'\n':'')+'اتجمع '+fmt(got)+' من '+fmt(P)+' '+S.cur+'\n'+(ok.length?'✅ دفعوا: '+ok.join('، ')+'\n':'')+(no.length?'⏳ لسه: '+no.join('، '):'الكل دفع 🎉');return 'https://wa.me/?text='+encodeURIComponent(t)}
function nd(s){return String(s??'').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632)}
function ym(v){if(v instanceof Date&&!isNaN(v)){const t=new Date(v.getTime()+432e5);return[t.getFullYear(),t.getMonth()+1]}const s=nd(v).trim();let r;if(r=s.match(/([0-9]{1,2})[-/.]([0-9]{1,2})[-/.]([0-9]{4})/))return[+r[3],+r[2]];if(r=s.match(/([0-9]{4})[-/.]([0-9]{1,2})/))return[+r[1],+r[2]];if(r=s.match(/([0-9]{1,2})[-/.]([0-9]{4})/))return[+r[2],+r[1]];return null}
function ymL(k){return new Date(Math.floor((k-1)/12),(k-1)%12,1).toLocaleDateString('ar-EG-u-nu-latn',{month:'long',year:'numeric'})}
function readX(f){if(!f)return;if(typeof XLSX=='undefined'){msg='مكتبة Excel ما اتحملتش، اتأكد من النت وجرب تاني';render();return}const r=new FileReader();r.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true});if(wb.Sheets['جدول القبض']){impS=readS(wb.Sheets['جدول القبض']);if(!impS.length)throw 0;imp=null;msg='';render();return}const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});const h=rows[0].map(x=>String(x)),ix=q=>h.findIndex(x=>q.test(x));const c={n:ix(/اسم|name/i),p:ix(/واتس|هاتف|موبايل|تليفون|رقم|phone|mobile/i),s:ix(/حصص|حصة|shares/i),a:ix(/مبلغ|قسط|amount/i),u:ix(/تحته|أشخاص|اشخاص|subs/i),d1:ix(/الأول|الاول|first/i),d2:ix(/الثاني|second/i)};c.d=h.findIndex((x,i)=>i!=c.d1&&i!=c.d2&&/قبض|تاريخ|دور|date|turn/i.test(x));if(c.n<0)throw 0;const L=[];rows.slice(1).forEach(x=>{const n=String(x[c.n]).trim();if(!n)return;let ph=c.p<0?'':nd(x[c.p]).trim().replace(/[ -]/g,'');if(/^1[0-9]{9}$/.test(ph))ph='0'+ph;const dt0=c.d<0?[]:(x[c.d] instanceof Date?[x[c.d]]:String(x[c.d]).split(/[,،;؛]|\n/)).map(ym).filter(Boolean);const dt=[...dt0,...[c.d1,c.d2].filter(k=>k>=0).map(k=>x[k] instanceof Date?x[k]:String(x[k])).map(ym).filter(Boolean)];const subs=c.u<0?[]:String(x[c.u]).split(/[،;؛]|\n/).map(s=>nd(s).trim().match(/^(.+?)[:=]?[ ]*([0-9.]+)$/)).filter(Boolean).map(q=>({n:q[1].trim(),a:parseFloat(q[2])}));L.push({name:n,phone:ph,subs,sh:c.s<0?0:parseFloat(nd(x[c.s]))||0,am:c.a<0?0:parseFloat(nd(x[c.a]))||0,dt})});if(!L.length)throw 0;imp=L;msg=''}catch(e){imp=null;msg='ما قدرتش أقرأ الملف. لازم أول صف يكون فيه عمود «الاسم»'}render()};r.readAsArrayBuffer(f)}
function plan(){const am=imp.filter(x=>x.am>0&&!x.sh).map(x=>x.am),all=[].concat(...imp.map(x=>x.dt)).map(d=>d[0]*12+d[1]);return{unit:am.length?Math.min(...am):S.unit,mn:all.length?Math.min(...all):null,mx:all.length?Math.max(...all):null}}
function impBox(){const p=plan(),ks={};let dup=0,n=0;imp.forEach(x=>x.dt.forEach(d=>{const k=d[0]*12+d[1];n++;if(ks[k])dup++;ks[k]=1}));return `<div class='card'><b>تم قراءة ${imp.length} عضو</b><p class='hint'>قسط الحصة: ${money(p.unit)}${p.mn!==null?' — من '+ymL(p.mn)+' إلى '+ymL(p.mx):''} — أدوار القبض: ${n}${dup?` <span class='bad'>(${dup} شهر متكرر، هيتسجل لآخر عضو)</span>`:''}</p><ul>${imp.slice(0,6).map(x=>`<li class='hint'>${esc(x.name)}: ${x.dt.map(d=>d[0]+'-'+String(d[1]).padStart(2,'0')).join('، ')||'—'}</li>`).join('')}</ul><div class='g2'><button class='btn' data-a='impok'>تأكيد (يستبدل الأعضاء والأدوار الحالية)</button><button class='pill' data-a='impno'>إلغاء</button></div></div>`}

    return `<li class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(m.name)} <span class='tag2'>${money(due(m))}</span> <small class='hint'>${ts.length} دور</small></b><button class="pill" data-a="del" data-id="${m.id}">${armed==k?'اضغط تاني للحذف':'حذف'}</button></div>
    <details><summary class='sm'>تعديل البيانات والأشخاص تحته</summary><div class="g2"><div><label>رقم الواتساب</label><input type="tel" inputmode="tel" value="${esc(m.phone)}" data-mf="phone" data-id="${m.id}" placeholder="01xxxxxxxxx"></div>
    <div><label>عدد الحصص</label><input type="number" step="0.5" min="0.5" value="${m.shares}" data-mf="shares" data-id="${m.id}"></div><div><label>المبلغ الشهري</label><input type='number' min='1' value='${due(m)}' data-mf='amount' data-id='${m.id}'></div></div>
    ${subsBox(m)}</details><p class='hint' style='margin:8px 0 4px'>يدفع ${money(due(m))} كل شهر${ts.length?' — يقبض '+money(pool())+' في كل دور:':' — لسه ما اتحددلوش دور.'}</p><div class='chips'>${ts.map(i=>`<button class='pill' data-a='rmt' data-i='${i}' aria-label='حذف دور ${mLabel(+i)}'>${mLabel(+i)} ✕</button>`).join('')}</div><div class='pa'><input type='month' id='tm${m.id}' aria-label='شهر القبض'><button class='pill' data-a='addt' data-id='${m.id}'>إضافة دور قبض</button></div></li>`}).join('');
  return `<h1>الأعضاء</h1><p class="sub">${S.members.length} مشترك — إجمالي الحصص ${S.members.reduce((a,m)=>a+m.shares,0)}</p><button class='pill' style='margin-bottom:10px' data-a='rp' data-k='members'>🖨 تقرير الأعضاء والمبالغ والأدوار (PDF)</button><button class='pill' style='margin-bottom:10px;margin-inline-start:6px' data-a='exx'>⬇ تصدير الأعضاء Excel</button>
  ${msg?`<p class='hint bad'>${esc(msg)}</p>`:''}<details class="card"${S.members.length?'':' open'}><summary class="sm"><b>＋ إضافة عضو</b></summary><label>الاسم</label><input id="nn" placeholder="اسم المشترك">
  <div class="g2"><div><label>رقم الواتساب</label><input id="np" type="tel" inputmode="tel" placeholder="01xxxxxxxxx"></div><div><label>عدد الحصص</label><input id="ns" type="number" step="0.5" min="0.5" value="1"></div></div>
  <div style="margin-top:12px"><button class="btn w" data-a="addm">إضافة العضو</button></div></details>
  <input type='search' id='q' placeholder='🔍 بحث بالاسم (واضغط Enter)' value='${esc(q)}' style='margin-bottom:10px'><ul>${rows}</ul>`;
}
function expT(){const c={};let b=0,bn=0;for(let i=0;i<S.months;i++){const t=sch(i).length?rtot(i):0;if(!t)continue;c[t]=(c[t]||0)+1;if(c[t]>bn){bn=c[t];b=t}}return b}
function vSched(){
  if(!S.members.length&&!Object.keys(S.sch||{}).length)return onb();
  const seg=`<div class='seg'>${[['roles','الأدوار'],['grid','المتابعة'],['sum','الملخص']].map(([k,l])=>`<button class='pill${sub==k?' ok':''}' data-a='sub' data-k='${k}'>${l}</button>`).join('')}</div>`;
  if(sub=='grid')return seg+vGrid();if(sub=='sum')return seg+vSum();
  const E=expT();let rows='';
  for(let i=0;i<S.months;i++){const s=sch(i),t=s.length?rtot(i):0,bad=t&&E&&t!=E;
    rows+=`<li class='row ${s.length?(bad?'s-pt':'s-ok'):'s-no'}'><div class='who'><b>${mLabel(i)}</b><small>${s.length?esc(rlist(i)):'لسه ما اتحددش'}</small></div>${t?`<b>${fmt(t)}</b>`:''}${bad?`<span class='pill bad'>⚠ ${t>E?'+':''}${fmt(t-E)}</span>`:''}<button class='pill' data-a='ed' data-i='${i}'>تعديل</button></li>`}
  return `${seg}<h1>جدول الأدوار</h1><p class='sub'>مدة الجمعية ${S.months} شهر — إجمالي القبض ${money(gt())}</p><button class='btn w' style='margin-bottom:10px' data-a='rp' data-k='roles'>🖨 طباعة / PDF</button><a class='btn w alt' style='margin-bottom:12px' target='_blank' rel='noopener' href='${rolesMsg()}'>إرسال الجدول واتساب</a><ul>${rows}</ul>`}
function edBox(i){const s=sch(i),E=expT(),t=s.length?rtot(i):0,bad=t&&E&&t!=E;
  return `<div class='mdl'><div class='mc'><div style='display:flex;justify-content:space-between;align-items:center'><b style='font-size:18px'>${mLabel(i)}</b><button class='ib' data-a='edx' aria-label='إغلاق'>✕</button></div><p class='hint'>القبض = القسط الشهري × ${S.months} شهر</p><ul>${s.map((x,j)=>`<li class='row'><div class='who'><b>${esc(x.n)}</b><small>قسط ${fmt(x.a/S.months)} شهرياً</small></div><b>${fmt(x.a)}</b><button class='pill' data-a='rsp' data-i='${i}' data-j='${j}'>حذف</button></li>`).join('')}</ul><div class='stat'><span>الإجمالي</span><b class='${bad?'bad':''}'>${fmt(t)}${bad?' ⚠ المتوقع '+fmt(E):''}</b></div><label>القابض</label><input id='sx${i}' list='ml' placeholder='اختار من الأعضاء أو اكتب الاسم'><datalist id='ml'>${S.members.map(m=>`<option value='${esc(m.name)}'>`).join('')}</datalist><label>القسط الشهري</label><input id='sy${i}' type='number' inputmode='decimal' min='1' placeholder='مثلاً 20000'><button class='btn w' style='margin-top:10px' data-a='asp' data-i='${i}'>إضافة قابض</button></div></div>`}
function vSum(){const E=expT(),pp={};let bad=0;for(let i=0;i<S.months;i++){const s=sch(i);if(!s.length||(E&&rtot(i)!=E))bad++;s.forEach(x=>{const o=pp[x.n]=pp[x.n]||{t:0,c:0};o.t+=x.a;o.c++})}
  const ns=Object.keys(pp).sort((a,b)=>pp[b].t-pp[a].t),all=ns.reduce((s,n)=>s+pp[n].t,0);
  return `<h1>الملخص</h1><p class='sub'>${bad?`<span class='bad'>${bad} شهر محتاج مراجعة</span>`:'<span class="ok">كل الشهور مظبوطة ✓</span>'}</p><div class='card'>${ns.map(n=>`<div class='stat'><span>${esc(n)} <small class='hint'>(${pp[n].c} دور${S.members.length&&!S.members.some(m=>m.name==n)?' — مش في الأعضاء':''})</small></span><b>${fmt(pp[n].t)}</b></div>`).join('')||`<p class='hint'>لسه مفيش أدوار.</p>`}<div class='stat'><b>إجمالي القبض</b><b>${money(all)}</b></div></div>`}
function onb(){const st=[['set','١. الإعدادات: اسم الجمعية وأول شهر ومدتها وقسط الحصة',S.name!='جمعية الأصحاب'],['members','٢. إضافة الأعضاء وأقساطهم',S.members.length],['sched','٣. أدوار القبض (يدوي أو استيراد Excel من الإعدادات)',Object.keys(S.sch).length+Object.keys(S.turns).length],['month','٤. تسجيل الدفعات كل شهر',Object.keys(S.pay).length]];
  return `<h1>ابدأ بـ 4 خطوات</h1><p class='sub'>كمّل الخطوات بالترتيب</p><ul>${st.map(([t,l,ok])=>`<li class='row ${ok?'s-ok':'s-no'}'><div class='who'><b>${ok?'✓':'○'} ${l}</b></div><button class='pill' data-a='tab' data-t='${t}'>${ok?'تعديل':'ابدأ'}</button></li>`).join('')}</ul>`}
function shift(v){const[y0,m0]=S.start.split('-').map(Number),[y1,m1]=v.split('-').map(Number),d=(y0-y1)*12+m0-m1,mv=o=>{const r={};Object.keys(o).forEach(k=>{if(+k+d>=0)r[+k+d]=o[k]});return r};S.turns=mv(S.turns);S.sch=mv(S.sch);S.rcv=mv(S.rcv);const p={};Object.keys(S.pay).forEach(k=>{const[i,id]=k.split(':');if(+i+d>=0)p[(+i+d)+':'+id]=S.pay[k]});S.pay=p;S.months=Math.max(1,S.months+d)}
function toast(t){const e=$('#ts');e.innerHTML=`<span>${t}</span><button data-a='undo'>تراجع</button>`;e.hidden=false;clearTimeout(tmr);tmr=setTimeout(()=>e.hidden=true,6000)}
function vSet(){
  return `<h1>الإعدادات</h1><p class="sub">كل بياناتك محفوظة على الجهاز ده.</p>
  ${gamBox()}<details class="card" open><summary class="sm"><b>إعدادات الجمعية</b></summary><label>اسم الجمعية</label><input data-set="name" value="${esc(S.name)}">
  <div class="g2"><div><label>أول شهر</label><input type="month" data-set="start" value="${S.start}"></div>
  <div><label>مدة الجمعية (بالشهور)</label><input type="number" min="1" max="120" data-set="months" value="${S.months}"></div></div>
  
  <div class="g2"><div><label>قسط الحصة الواحدة شهرياً</label><input type="number" min="1" data-set="unit" value="${S.unit}"></div>
  <div><label>العملة</label><input data-set="cur" value="${esc(S.cur)}"></div></div>
  <label>يوم الاستحقاق من كل شهر (0 = بدون)</label><input type='number' min='0' max='31' data-set='dueDay' value='${S.dueDay||0}'><label>كود الدولة للواتساب (مصر 20، السعودية 966)</label><input inputmode="numeric" data-set="cc" value="${esc(S.cc)}"></details>
  <details class="card"><summary class="sm"><b>رسالة التذكير</b></summary><label>استخدم {name} و{month} و{amount}</label><textarea data-set="tpl">${esc(S.tpl)}</textarea></details>
  <div class='card'><b>استيراد من Excel</b><p class='hint' style='margin:2px 0 8px'>ملف أول صف فيه: الاسم، رقم الواتساب، عدد الحصص أو المبلغ الشهري، تواريخ القبض (مثلاً 2026-11، 2027-05 لو القبض مرتين). أو ملف فيه ورقة «جدول القبض» (الشهر، الاسم، المبلغ) لو القبض بيتقسم على أكتر من شخص.</p>${msg?`<p class='hint bad'>${esc(msg)}</p>`:''}<input type='file' id='xf' accept='.xlsx,.xls,.csv'></div>${imp?impBox():''}${impS?impSBox():''}${pinBox()}${logBox()}<div class="card"><b>نسخة احتياطية</b><p class="hint" style="margin:2px 0 8px">انسخ النص واحتفظ بيه، ولصقه هنا لاسترجاع بياناتك.</p>
  <textarea id="bk" dir="ltr" placeholder="الصق النسخة هنا"></textarea>
  <div class="g2" style="margin-top:8px"><button class="btn" data-a="exp">إنشاء ونسخ</button><button class="btn" data-a="imp">استرجاع</button></div></div>
  <button class="btn warn w" data-a="reset">${armed=='reset'?'اضغط تاني لمسح كل شيء':'مسح كل البيانات'}</button>`;
}
const V={home:vHome,month:vMonth,grid:vGrid,members:vMembers,sched:vSched,set:vSet};
const T=[['month','<i>💳</i>الشهر'],['sched','<i>📅</i>الجدول'],['members','<i>👥</i>الأعضاء'],['set','<i>⚙️</i>الإعدادات']];
function render(){
  $('#app').innerHTML=V[tab]();$('#md').innerHTML=ed>=0&&tab=='sched'?edBox(ed):'';
  $('#tabs').innerHTML=T.map(([k,l])=>`<button data-a="tab" data-t="${k}"${k==tab?' aria-current="true"':''}>${l}</button>`).join('');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;const B=snp(),PRE=JSON.stringify(S);
  msg='';if(a!='del'&&a!='reset'&&a!='delg')armed='';
  if(a=='tab'){tab=b.dataset.t;ed=-1;window.scrollTo(0,0)}
  else if(a=='sub')sub=b.dataset.k;else if(a=='ed')ed=+b.dataset.i;else if(a=='edx')ed=-1;else if(a=='flt')flt=flt?0:1;else if(a=='undo'){if(UND){S=Object.assign(D(),JSON.parse(UND));ALL.items[ALL.cur]=S;save();UND=null;$('#ts').hidden=true}}else if(a=='allpay'){S.members.forEach(m=>S.pay[mi+':'+m.id]=due(m));save()}else if(a=='half'){const m=mem(id);S.pay[mi+':'+id]=Math.min(due(m),amt(m,mi)+due(m)/2);save()}
  else if(a=='prev')mi=Math.max(0,mi-1);
  else if(a=='next')mi=Math.min(S.months-1,mi+1);
  else if(a=='pay'){const m=mem(id);S.pay[mi+':'+id]=rest(m,mi)>0?due(m):0;save()}
  else if(a=='part'){const m=mem(id),el=document.getElementById('pa'+id),v=parseFloat(el.value);if(!(v>0)){el.focus();return}S.pay[mi+':'+id]=Math.min(due(m),amt(m,mi)+v);save()}
  else if(a=='zero'){S.pay[mi+':'+id]=0;save()}
  else if(a=='rcv'){S.rcv[mi]?delete S.rcv[mi]:S.rcv[mi]=1;save()}
  else if(a=='go'){mi=+b.dataset.i;tab='month';window.scrollTo(0,0)}
  else if(a=='addt'){const p=ym(document.getElementById('tm'+id).value);if(!p)msg='اختار الشهر الأول';else{const[y,m]=S.start.split('-').map(Number),i=(p[0]-y)*12+p[1]-m;if(i<0)msg='الشهر ده قبل بداية الجمعية ('+mLabel(0)+'). غيّر أول شهر من الإعدادات.';else if(S.turns[i]&&S.turns[i]!=id)msg='الشهر ده محجوز لـ '+(mem(S.turns[i])||{}).name;else{S.turns[i]=id;if(i>=S.months)S.months=i+1;save()}}}
  else if(a=='rmt'){delete S.turns[b.dataset.i];save()}
  else if(a=='adds'){const m=mem(id),n=document.getElementById('sn'+id).value.trim(),v=parseFloat(document.getElementById('sa'+id).value);if(!n||!(v>0))msg='اكتب الاسم والمبلغ';else if((m.subs||[]).reduce((x,y)=>x+y.a,0)+v>due(m))msg='مجموع اللي تحت العضو أكبر من مبلغه الشهري ('+fmt(due(m))+')';else{(m.subs=m.subs||[]).push({n,a:v});save()}}
  else if(a=='rms'){mem(id).subs.splice(+b.dataset.j,1);save()}
  else if(a=='rp'){if(b.dataset.i!==undefined)mi=+b.dataset.i;({roles:repRoles,members:repMembers,pay:()=>repPay(mi)})[b.dataset.k]();return}
  else if(a=='sw'){ALL.items[ALL.cur]=S;ALL.cur=id;S=Object.assign(D(),ALL.items[id]);mi=curIdx();save()}
  else if(a=='ng'){ALL.items[ALL.cur]=S;const g='g'+Date.now().toString(36);ALL.items[g]=Object.assign(D(),{name:'جمعية '+(Object.keys(ALL.items).length+1)});ALL.cur=g;S=ALL.items[g];mi=0;save()}
  else if(a=='delg'){if(armed!='delg')armed='delg';else{armed='';delete ALL.items[ALL.cur];ALL.cur=Object.keys(ALL.items)[0];S=Object.assign(D(),ALL.items[ALL.cur]);mi=curIdx();save()}}
  else if(a=='asp'){const i=b.dataset.i,n=document.getElementById('sx'+i).value.trim(),v=parseFloat(document.getElementById('sy'+i).value);if(!n||!(v>0)){document.getElementById('sx'+i).focus();return}(S.sch[i]=S.sch[i]||[]).push({n,a:v*S.months});save()}
  else if(a=='rsp'){const i=b.dataset.i;S.sch[i].splice(+b.dataset.j,1);if(!S.sch[i].length)delete S.sch[i];save()}
  else if(a=='impsno')impS=null;
  else if(a=='impsok'){const k=impS.map(x=>x.k),mn=Math.min(...k),mx=Math.max(...k);S.start=Math.floor((mn-1)/12)+'-'+String((mn-1)%12+1).padStart(2,'0');S.months=Math.max(S.months,mx-mn+1);S.sch={};S.turns={};impS.forEach(x=>{(S.sch[x.k-mn]=S.sch[x.k-mn]||[]).push({n:x.n,a:x.a})});impS=null;mi=curIdx();save();tab='sched'}
  else if(a=='setpin'){const v=document.getElementById('pn').value;if(!/^[0-9]{4,8}$/.test(v))msg='الرقم السري لازم يكون من 4 إلى 8 أرقام';else{try{localStorage.setItem('gameya_pin',hp(v));msg='تم تفعيل القفل ✓'}catch(x){msg='ما قدرتش أحفظ الرقم'}}}
  else if(a=='rmpin'){try{localStorage.removeItem('gameya_pin')}catch(x){}}
  else if(a=='unlock'){const v=document.getElementById('lki').value;if(hp(v)==gp())document.getElementById('lk').hidden=true;else document.getElementById('lke').textContent='الرقم غلط';return}
  else if(a=='exx'){exportX().then(render);return}
  else if(a=='doprint'){try{window.print()}catch(x){}return}
  else if(a=='closep'){document.getElementById('pr').hidden=true;document.body.classList.remove('po');return}
  else if(a=='impno')imp=null;
  else if(a=='impok'){const p=plan(),k=q=>q[0]*12+q[1];if(p.mn!==null){S.start=Math.floor((p.mn-1)/12)+'-'+String((p.mn-1)%12+1).padStart(2,'0');S.months=Math.max(S.months,p.mx-p.mn+1)}S.unit=p.unit;S.members=[];S.turns={};S.sch={};S.pay={};S.paid={};S.rcv={};imp.forEach((x,j)=>{const id2=Date.now().toString(36)+j;S.members.push({id:id2,name:x.name,phone:x.phone,subs:x.subs||[],shares:x.sh||(x.am?Math.round(x.am/p.unit*100)/100:1)});x.dt.forEach(q=>{S.turns[k(q)-p.mn]=id2})});imp=null;mi=curIdx();save();tab='members'}
  else if(a=='mo'){S.months=+b.dataset.n;save()}
  else if(a=='addm'){const n=$('#nn').value.trim();if(!n){$('#nn').focus();return}
    S.members.push({id:Date.now().toString(36)+Math.floor(Math.random()*99),name:n,phone:$('#np').value.trim(),shares:Math.max(.5,parseFloat($('#ns').value)||1)});save()}
  else if(a=='del'){const k='del'+id;if(armed!=k){armed=k}else{armed='';S.members=S.members.filter(m=>m.id!=id);Object.keys(S.turns).forEach(i=>{if(S.turns[i]==id)delete S.turns[i]});['paid','pay'].forEach(f=>Object.keys(S[f]).forEach(k2=>{if(k2.split(':')[1]==id)delete S[f][k2]}));save()}}
  else if(a=='exp'){const t=$('#bk');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(x){}return}
  else if(a=='imp'){try{S=Object.assign(D(),JSON.parse($('#bk').value));save();mi=curIdx()}catch(x){$('#bk').value='النص ده مش نسخة صحيحة';return}}
  else if(a=='reset'){if(armed!='reset'){armed='reset'}else{armed='';S=D();save();mi=0}}
  dl(B);if(!['undo','sw','ng','delg'].includes(a)&&JSON.stringify(S)!=PRE){UND=PRE;toast('تم الحفظ')}render();});
document.addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(d.set){let v=t.value;if(d.set=='months')v=Math.min(120,Math.max(1,parseInt(v)||1));if(d.set=='unit')v=Math.max(1,parseFloat(v)||1);if(d.set=='dueDay')v=Math.min(31,Math.max(0,parseInt(v)||0));if(d.set=='start'&&v&&v!=S.start)shift(v);S[d.set]=v;if(d.set=='months'||d.set=='start')mi=Math.min(curIdx(),S.months-1);save();render()}
  else if(d.turn!==undefined){const B=snp();t.value?S.turns[d.turn]=t.value:delete S.turns[d.turn];dl(B);save();render()}
  else if(d.sw!==undefined){ALL.items[ALL.cur]=S;ALL.cur=t.value;S=Object.assign(D(),ALL.items[t.value]);mi=curIdx();save();render()}
  else if(t.id=='q'){q=t.value.trim();render()}
  else if(t.id=='xf'){readX(t.files[0])}
  else if(d.mf){const m=mem(d.id);if(!m)return;if(d.mf=='amount')m.shares=Math.max(.5,Math.round((parseFloat(t.value)||S.unit)/S.unit*100)/100);else m[d.mf]=d.mf=='shares'?Math.max(.5,parseFloat(t.value)||1):t.value.trim();save();render()}
});
render();lock();let away=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)away=Date.now();else if(away&&Date.now()-away>60000)lock()});document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='lki')document.querySelector('[data-a=unlock]').click()});
</script>
